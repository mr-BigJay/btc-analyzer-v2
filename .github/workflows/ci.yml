name: CI

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Static analysis (compile + ruff)
        run: |
          python -m compileall -q src
          ruff check src tests || true

      - name: Unit tests
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:////tmp/btc_analyzer_ci.db
          REDIS_URL: ""
          API_RATE_LIMIT_PER_MINUTE: "5000"
        run: python -m pytest -q

      - name: Container build verification
        run: docker build -t btc-analyzer:ci .

      # Security / dependency scanning hooks (advisory — non-blocking scaffold)
      - name: Dependency inventory
        run: pip freeze > /tmp/requirements.freeze.txt && wc -l /tmp/requirements.freeze.txt
