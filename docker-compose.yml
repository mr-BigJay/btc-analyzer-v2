# BTC Analyzer — Chapter 20 Deployment topology
# Services communicate by Compose DNS names (postgres, redis, api, …).
# TLS terminates at nginx; application services stay off the public edge.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc_analyzer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${API_JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    # Horizontal scale: docker compose up --scale api=2 (nginx upstream must match)

  scheduler:
    build: .
    command: ["python", "-m", "src.main", "run"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${API_JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # Single active scheduler preferred; use leader election before scaling

  collectors:
    build: .
    command:
      [
        "sh",
        "-c",
        "while true; do python -m src.main collect; sleep 300; done",
      ]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  ai:
    build: .
    command:
      [
        "sh",
        "-c",
        "while true; do python -c 'from src.services.ai import AIService; print(AIService().architecture())'; sleep 3600; done",
      ]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [btcnet]
    restart: unless-stopped
    profiles: ["ai"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [btcnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  btcnet:
    driver: bridge

volumes:
  pgdata:
  redisdata:
