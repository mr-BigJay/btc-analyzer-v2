services:
  postgres:
    image: postgres:16-alpine
    container_name: btc-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: btc-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  btc-analyzer:
    build: .
    container_name: btc-analyzer-v3
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    command: python -m src.main serve

volumes:
  pgdata:
