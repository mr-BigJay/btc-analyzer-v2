services:
  postgres:
    image: postgres:16-alpine
    container_name: btc-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: btc-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: btc-analyzer-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      TIMEZONE: UTC
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    command: python -m src.main serve
    expose:
      - "8000"

  scheduler:
    build: .
    container_name: btc-analyzer-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://btc:btc@postgres:5432/btc_analyzer
      REDIS_URL: redis://redis:6379/0
      TIMEZONE: UTC
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    command: python -m src.main run

  nginx:
    image: nginx:1.27-alpine
    container_name: btc-analyzer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
