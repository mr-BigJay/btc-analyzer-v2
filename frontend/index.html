<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Analyzer v3</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <p class="eyebrow">BTC Analyzer · Rewrite v3</p>
    <h1>Market Intelligence<br/>Decision Support</h1>
    <p class="lede">
      Decision Support System. Evidence-based scenarios. Probability over prediction. Risk first.
    </p>
    <ul class="pipeline">
      <li>Collect</li>
      <li>Validate</li>
      <li>Normalize</li>
      <li>Analyze</li>
      <li>Probability</li>
      <li>Daily Outlook</li>
      <li>Intraday Plan</li>
      <li>Bitunix Validate</li>
    </ul>
    <p class="status" id="status">Loading…</p>
  </main>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => {
        document.getElementById("status").textContent =
          `${d.version} · ${d.phase} · chapter ${d.chapter}`;
      })
      .catch(() => {
        document.getElementById("status").textContent = "API offline";
      });
  </script>
</body>
</html>
