<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Options — Deribit</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/options.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" class="nav-link">← Spot</a>
      <h1>Options Analytics</h1>
    </div>
    <div class="header-right">
      <span id="spot-price" class="muted">—</span>
      <span id="mode-badge" class="badge">—</span>
      <span id="updated-at" class="muted">—</span>
    </div>
  </header>

  <main class="options-layout">
    <section class="card screener-panel">
      <div class="panel-header">
        <h2>Market Screener</h2>
        <span class="muted auto-label">🔄 جمع‌آوری خودکار</span>
      </div>

      <div class="summary-bar">
        <div><span class="label">تعداد</span><strong id="sum-count">—</strong></div>
        <div><span class="label">حجم کل</span><strong id="sum-size">—</strong></div>
        <div><span class="label">ارزش ورود (USD)</span><strong id="sum-value">—</strong></div>
      </div>

      <div class="table-wrap">
        <table id="screener-table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Expiry</th>
              <th>Strike</th>
              <th>Underlying</th>
              <th>Price & IV</th>
              <th>Side</th>
              <th>Size</th>
              <th>Entry Value</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="screener-body">
            <tr><td colspan="9" class="muted">در حال بارگذاری...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card graph-panel">
      <div class="panel-header">
        <h2>Risk Profile</h2>
        <span class="muted auto-label">PnL + Greeks — خودکار</span>
      </div>
      <p id="graph-subtitle" class="muted graph-hint"></p>
      <div id="risk-chart"></div>
    </section>
  </main>

  <script src="/js/options.js"></script>
</body>
</html>
