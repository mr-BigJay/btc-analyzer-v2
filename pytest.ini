[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: Unit-level tests (Ch.22 pyramid base)
    integration: Integration tests across components
    e2e: End-to-end workflow scenarios
    performance: Performance / load / stress checks
    security: Security validation tests
    ai: AI output validation tests
    regression: Regression protection scenarios
filterwarnings =
    ignore::DeprecationWarning
